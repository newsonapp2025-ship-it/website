<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="hsl(0, 72%, 51%)"/>
  <!-- Newspaper icon -->
  <rect x="20" y="25" width="60" height="50" rx="3" fill="white" opacity="0.95"/>
  <line x1="30" y1="35" x2="70" y2="35" stroke="hsl(0, 72%, 51%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="42" x2="70" y2="42" stroke="hsl(0, 72%, 51%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="49" x2="55" y2="49" stroke="hsl(0, 72%, 51%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="50" y2="56" stroke="hsl(0, 72%, 51%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="63" x2="60" y2="63" stroke="hsl(0, 72%, 51%)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Breaking news indicator -->
  <circle cx="75" cy="40" r="6" fill="hsl(0, 72%, 51%)"/>
  <text x="75" y="44" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>

