# SPA deep-link rewrites are NOT part of the Amplify buildspec.
# Import amplify-redirects.json in Amplify Console → Hosting → Rewrites and redirects
# (200 rewrite to /index.html) so /about, /article/*, etc. do not return hosting 404.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
