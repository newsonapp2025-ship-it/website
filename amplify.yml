# SPA deep links: configure in Amplify Console → Hosting → Rewrites and redirects.
#
# BROKEN (do not use):
#   Source: /<*>   Target: /index.html   Type: 200 (Rewrite)
#   → serves HTML for .js/.css and causes MIME errors.
#
# CORRECT (use this — also in amplify-redirects.json):
#   Source: /<*>   Target: /index.html   Type: 404-200
#   → only rewrites when the file is missing; real JS/CSS/images are served normally.
#
# Console steps: Rewrites and redirects → Open text editor → replace ALL rules with
# amplify-redirects.json → Save. No redeploy required; hard-refresh the site after.
#
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
