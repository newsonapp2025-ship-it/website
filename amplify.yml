# SPA deep-link rewrites are configured in Amplify Console (NOT in this buildspec).
#
# CRITICAL: Do NOT use Source "/<*>" → "/index.html" (200).
# That rewrites JS/CSS/images to HTML and breaks the site with:
#   "Failed to load module script... MIME type of text/html"
#
# Use the rule in amplify-redirects.json instead (regex that excludes .js/.css/.png/...).
# Amplify Console → Hosting → Rewrites and redirects → Open text editor → paste JSON → Save.
#
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
